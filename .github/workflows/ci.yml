name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - name: Unit tests, including published setup preview and the vault menu
        run: bun run test
      - name: Refuse tracked ignored CortexKit files
        shell: bash
        run: |
          tracked=$(git ls-files -ci --exclude-standard -- .cortexkit)
          test -z "$tracked" || { printf '%s\n' "$tracked"; exit 1; }

  setup-menu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - name: Enroll clean profiles, execute printed commands and serve fixture requests on all three hosts
        env:
          CLAUSTRUM_AUTH_SETUP_E2E: '1'
          CLAUSTRUM_AUTH_OPENCODE1_E2E: '1'
          CLAUSTRUM_AUTH_OPENCODE2_E2E: '1'
          CLAUSTRUM_AUTH_PI_E2E: '1'
        run: bun test packages/opencode/test/opencode1.e2e.test.ts packages/opencode/test/v2/e2e/opencode2.e2e.test.ts packages/pi/test/extension.e2e.test.ts --test-name-pattern 'setup test build' --timeout 600000

  # The Pi extension against the real, pinned Pi CLI: serving, refusals,
  # redirects, slots, and the Pi spike of docs/pi-spike.md. Every test
  # isolates PI_CODING_AGENT_DIR, HOME and USERPROFILE under its own scratch
  # folder, so the runner's own ~/.pi is never used.
  pi-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - run: bun test packages/pi/test
        env:
          CLAUSTRUM_AUTH_PI_E2E: '1'

  # Real-host tests on the pinned OpenCode 1 host: serving, redirects,
  # redaction and activation. The test installs opencode-ai into
  # target/opencode1-host on first use.
  opencode1-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - name: OpenCode 1 real-host tests
        env:
          CLAUSTRUM_AUTH_OPENCODE1_E2E: '1'
        run: bun test packages/opencode/test/opencode1.e2e.test.ts --timeout 600000

  # The OpenCode 2 entry on the real pinned host (@opencode/cli, see
  # OPENCODE_CLI_VERSION in the test) against a loopback mock provider and a
  # fake vault, including the proof that a cross-origin redirect never
  # carries the vault key.
  # It installs the CLI with npm, so it needs the network.
  opencode2-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - name: OpenCode 2 real-host cases
        working-directory: packages/opencode
        env:
          CLAUSTRUM_AUTH_OPENCODE2_E2E: '1'
        run: bun test --timeout 600000 test/v2/e2e/opencode2.e2e.test.ts
